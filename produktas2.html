<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: transparent;
}

.product {
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
    background: white;
    text-align: center;
}

.name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.price {
    font-size: 17px;
    margin-bottom: 12px;
}

button {
    background: #222;
    color: white;
    border: none;
    border-radius: 7px;
    padding: 10px 18px;
    cursor: pointer;
    font-size: 15px;
}
</style>
</head>

<body>

<div class="product">

    <div class="name">
        Maitinamasis rankų ir kūno kremas 380 ml
    </div>

    <div class="price">
        17,99 €
    </div>

    <button onclick="addToCart()">
        Įdėti į krepšelį
    </button>

</div>

<script>
function addToCart() {

    let cart =
        JSON.parse(localStorage.getItem("manoKrepselis")) || [];

    let product = cart.find(
        item => item.name === "Maitinamasis rankų ir kūno kremas 380 ml"
    );

    if (product) {
        product.quantity++;
    } else {
        cart.push({
            name: "Maitinamasis rankų ir kūno kremas 380 ml",
            price: 17.99,
            quantity: 1
        });
    }

    localStorage.setItem(
        "manoKrepselis",
        JSON.stringify(cart)
    );

    alert("Kremas įdėtas į krepšelį!");
}
</script>

</body>
</html>
