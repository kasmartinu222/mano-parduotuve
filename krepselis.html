<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: transparent;
      color: #222;
    }

    .cart {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      box-sizing: border-box;
    }

    .cart h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 26px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 5px;
    }

    .item-price {
      color: #666;
      font-size: 15px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity button {
      width: 32px;
      height: 32px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      color: #222;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      padding: 0;
    }

    .quantity button:hover {
      background: #e9e9e9;
    }

    .quantity span {
      min-width: 25px;
      text-align: center;
      font-weight: bold;
    }

    .item-total {
      width: 90px;
      text-align: right;
      font-weight: bold;
    }

    .remove {
      border: none;
      background: transparent;
      color: #d00;
      cursor: pointer;
      font-size: 14px;
    }

    .cart-bottom {
      margin-top: 20px;
    }

    .total {
      display: flex;
      justify-content: space-between;
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .checkout {
      width: 100%;
      border: none;
      background: #222;
      color: white;
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 17px;
      font-weight: bold;
    }

    .checkout:hover {
      background: #444;
    }

    .empty {
      text-align: center;
      padding: 40px 10px;
      color: #777;
      font-size: 17px;
    }

    @media (max-width: 600px) {
      .cart {
        margin: 10px;
        padding: 15px;
      }

      .cart-item {
        flex-wrap: wrap;
      }

      .item-info {
        width: 100%;
        flex-basis: 100%;
      }

      .item-total {
        width: auto;
      }
    }
  </style>
</head>

<body>

  <div class="cart">
    <h2>Mano krepšelis</h2>

    <div id="cartItems"></div>

    <div class="cart-bottom" id="cartBottom" style="display:none;">
      <div class="total">
        <span>Viso:</span>
        <span id="cartTotal">0,00 €</span>
      </div>

      <button class="checkout" onclick="checkout()">
        Apmokėti
      </button>
    </div>
  </div>

  <script>
    function getCart() {
      return JSON.parse(localStorage.getItem("manoKrepselis")) || [];
    }

    function saveCart(cart) {
      localStorage.setItem("manoKrepselis", JSON.stringify(cart));
    }

    function formatPrice(price) {
      return price.toFixed(2).replace(".", ",") + " €";
    }

    function renderCart() {
      const cart = getCart();
      const cartItems = document.getElementById("cartItems");
      const cartBottom = document.getElementById("cartBottom");
      const cartTotal = document.getElementById("cartTotal");

      cartItems.innerHTML = "";

      if (cart.length === 0) {
        cartItems.innerHTML = `
          <div class="empty">
            Krepšelis tuščias.
          </div>
        `;

        cartBottom.style.display = "none";
        return;
      }

      let total = 0;

      cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;

        const itemElement = document.createElement("div");
        itemElement.className = "cart-item";

        itemElement.innerHTML = `
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-price">
              ${formatPrice(item.price)} / vnt.
            </div>
          </div>

          <div class="quantity">
            <button onclick="changeQuantity(${index}, -1)">−</button>
            <span>${item.quantity}</span>
            <button onclick="changeQuantity(${index}, 1)">+</button>
          </div>

          <div class="item-total">
            ${formatPrice(itemTotal)}
          </div>

          <button class="remove" onclick="removeItem(${index})">
            Pašalinti
          </button>
        `;

        cartItems.appendChild(itemElement);
      });

      cartTotal.textContent = formatPrice(total);
      cartBottom.style.display = "block";
    }

    function changeQuantity(index, amount) {
      const cart = getCart();

      cart[index].quantity += amount;

      if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
      }

      saveCart(cart);
      renderCart();
    }

    function removeItem(index) {
      const cart = getCart();

      cart.splice(index, 1);

      saveCart(cart);
      renderCart();
    }

    function checkout() {
      const cart = getCart();

      if (cart.length === 0) {
        alert("Krepšelis tuščias.");
        return;
      }

      const total = cart.reduce(
        (sum, item) => sum + item.price * item.quantity,
        0
      );

      alert(
        "Apmokėjimas\n\n" +
        "Užsakymo suma: " +
        formatPrice(total)
      );

      // ČIA gali įdėti tikrą mokėjimo sistemos nuorodą
      // window.location.href = "TAVO-APMOKEJIMO-NUORODA";
    }

    renderCart();
  </script>

</body>
</html>
