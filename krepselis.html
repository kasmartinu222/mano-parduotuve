<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: transparent;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  border-radius: 10px;
  overflow: hidden;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #ddd;
  text-align: left;
}

th {
  background: #222;
  color: white;
}

.quantity button {
  padding: 4px 9px;
  margin: 0 3px;
  border: 1px solid #ccc;
  background: white;
  border-radius: 5px;
  cursor: pointer;
}

.remove {
  border: none;
  background: none;
  cursor: pointer;
}

.total {
  margin-top: 15px;
  font-size: 18px;
  font-weight: bold;
  text-align: right;
}
</style>
</head>

<body>

<h3>🛒 Krepšelis</h3>

<table>
<thead>
<tr>
<th>Prekė</th>
<th>Kiekis</th>
<th>Kaina</th>
<th></th>
</tr>
</thead>

<tbody id="items"></tbody>
</table>

<div class="total">
Iš viso: <span id="total">0.00</span> €
</div>

<script>

const CART_KEY = "manoKrepselis";

function getCart() {
  try {
    return JSON.parse(localStorage.getItem(CART_KEY)) || [];
  } catch {
    return [];
  }
}

function saveCart(cart) {
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
}

function updateCart() {

  const cart = getCart();

  let html = "";
  let total = 0;

  if (cart.length === 0) {

    html = `
      <tr>
        <td colspan="4">Krepšelis tuščias</td>
      </tr>
    `;

  } else {

    cart.forEach((item, index) => {

      const quantity = Number(item.quantity) || 1;
      const price = Number(item.price) || 0;

      total += price * quantity;

      html += `
        <tr>

          <td>${item.name}</td>

          <td class="quantity">
            <button onclick="changeQuantity(${index}, -1)">−</button>
            ${quantity}
            <button onclick="changeQuantity(${index}, 1)">+</button>
          </td>

          <td>${(price * quantity).toFixed(2)} €</td>

          <td>
            <button class="remove" onclick="removeItem(${index})">
              ❌
            </button>
          </td>

        </tr>
      `;
    });
  }

  document.getElementById("items").innerHTML = html;
  document.getElementById("total").textContent = total.toFixed(2);
}

function changeQuantity(index, amount) {

  const cart = getCart();

  cart[index].quantity =
    (Number(cart[index].quantity) || 1) + amount;

  if (cart[index].quantity <= 0) {
    cart.splice(index, 1);
  }

  saveCart(cart);
  updateCart();
}

function removeItem(index) {

  const cart = getCart();

  cart.splice(index, 1);

  saveCart(cart);
  updateCart();
}

window.addEventListener("storage", updateCart);

updateCart();

</script>

</body>
</html>
