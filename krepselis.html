<html lang="lt">

<title>Mano krepšelis</title>

<style>

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

.container {
    max-width: 800px;
    margin: auto;
}

h1 {
    margin-bottom: 25px;
}


/* KREPŠELIO PREKĖ */

.item {
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 12px;

    display: flex;
    align-items: center;
    gap: 15px;
}

.item-info {
    flex: 1;
}

.item-name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 7px;
}

.item-price {
    color: #666;
}


/* KIEKIS */

.quantity {
    display: flex;
    align-items: center;
    gap: 8px;
}

.quantity button {
    width: 32px;
    height: 32px;

    border: 0;
    border-radius: 6px;

    background: #eee;
    color: #222;

    font-size: 18px;
    cursor: pointer;
}

.quantity button:hover {
    background: #ddd;
}

.quantity span {
    min-width: 25px;
    text-align: center;
    font-weight: bold;
}


/* PREKĖS SUMA */

.item-total {
    min-width: 80px;
    text-align: right;
    font-weight: bold;
}


/* PAŠALINTI */

.remove {
    border: 0;
    background: #222;
    color: white;

    border-radius: 6px;
    padding: 7px 10px;

    cursor: pointer;
}


/* APAČIA */

.summary {
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;

    padding: 20px;
    margin-top: 20px;
}

.summary-row {
    display: flex;
    justify-content: space-between;

    font-size: 20px;
    font-weight: bold;

    margin-bottom: 18px;
}


/* APMOKĖJIMO MYGTUKAS */

.checkout {
    width: 100%;

    border: 0;
    border-radius: 8px;

    padding: 15px;

    background: #222;
    color: white;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;
}

.checkout:hover {
    background: #444;
}


/* TUŠČIAS KREPŠELIS */

.empty {
    background: white;

    border: 1px solid #ddd;
    border-radius: 12px;

    padding: 40px 20px;

    text-align: center;

    color: #777;
    font-size: 18px;
}


/* TELEFONUI */

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    .item {
        flex-wrap: wrap;
    }

    .item-info {
        width: 100%;
        flex-basis: 100%;
    }

    .item-total {
        text-align: left;
    }

}

</style>
</head>
