<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  padding: 20px;
}

.container {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #ddd;
  text-align: left;
}

.quantity button {
  padding: 5px 9px;
  margin: 0 3px;
  border: 1px solid #ccc;
  background: white;
  border-radius: 5px;
  cursor: pointer;
}

.remove {
  border: none;
  background: transparent;
  cursor: pointer;
}

.total {
  text-align: right;
  font-size: 20px;
  font-weight: bold;
  margin-top: 20px;
}

.buttons {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

button {
  cursor: pointer;
}

.clear {
  padding: 10px 15px;
  background: #ddd;
  border: none;
  border-radius: 7px;
}

.pay {
  padding: 10px 20px;
  background: #222;
  color: white;
  border: none;
  border-radius: 7px;
  font-size: 16px;
}

.empty {
  text-align: center;
  padding: 25px;
}
</style>
</head>

<body>

<div class="container">

<h2>🛒 Krepšelis</h2>

<div id="cartContent"></div>

</div>

<script>

const CART_KEY = "manoKrepselis";

function getCart() {
  try {
    return JSON.parse(localStorage.getItem(CART_KEY)) || [];
  } catch {
    return [];
  }
}

function saveCart(cart) {
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
}

function updateCart() {

  const cart = getCart();
  const content = document.getElementById("cartContent");

  if (cart.length === 0) {
    content.innerHTML = `
      <div class="empty">
        Krepšelis tuščias.
      </div>
    `;
    return;
  }

  let total = 0;

  let html = `
    <table>
      <thead>
        <tr>
          <th>Prekė</th>
          <th>Kiekis</th>
          <th>Kaina</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
  `;

  cart.forEach((item, index) => {

    const quantity = Number(item.quantity) || 1;
    const price = Number(item.price) || 0;
    const subtotal = price * quantity;

    total += subtotal;

    html += `
      <tr>
        <td>${item.name}</td>

        <td class="quantity">
          <button onclick="changeQuantity(${index}, -1)">−</button>
          ${quantity}
          <button onclick="changeQuantity(${index}, 1)">+</button>
        </td>

        <td>${subtotal.toFixed(2)} €</td>

        <td>
          <button class="remove" onclick="removeItem(${index})">
            ❌
          </button>
        </td>
      </tr>
    `;
  });

  html += `
      </tbody>
    </table>

    <div class="total">
      Iš viso: ${total.toFixed(2)} €
    </div>

    <div class="buttons">

      <button class="clear" onclick="clearCart()">
        Išvalyti
      </button>

      <button class="pay" onclick="checkout()">
        💳 Apmokėti
      </button>

    </div>
  `;

  content.innerHTML = html;
}

function changeQuantity(index, amount) {

  const cart = getCart();

  cart[index].quantity =
    (Number(cart[index].quantity) || 1) + amount;

  if (cart[index].quantity <= 0) {
    cart.splice(index, 1);
  }

  saveCart(cart);
  updateCart();
}

function removeItem(index) {

  const cart = getCart();

  cart.splice(index, 1);

  saveCart(cart);
  updateCart();
}

function clearCart() {

  localStorage.removeItem(CART_KEY);

  updateCart();
}

function checkout() {

  const cart = getCart();

  if (cart.length === 0) {
    alert("Krepšelis tuščias.");
    return;
  }

  let total = 0;

  cart.forEach(item => {
    total += Number(item.price) * Number(item.quantity);
  });

  alert(
    "Užsakymas paruoštas!\n\n" +
    "Suma: " + total.toFixed(2) + " €"
  );
}

window.addEventListener("storage", updateCart);

updateCart();

</script>

</body>
</html>
