<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: transparent;
}

.cart {
    position: relative;
    display: inline-block;
}

.cart-button {
    background: #222;
    color: white;
    border: none;
    border-radius: 22px;
    padding: 9px 15px;
    font-size: 14px;
    cursor: pointer;
}

.cart-window {
    display: none;
    position: absolute;
    right: 0;
    top: 45px;
    width: 290px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.18);
    z-index: 9999;
}

.cart-window.open {
    display: block;
}

.title {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 12px;
}

.item {
    border-bottom: 1px solid #eee;
    padding: 9px 0;
}

.item-name {
    font-weight: bold;
    margin-bottom: 5px;
}

.controls {
    display: flex;
    align-items: center;
    gap: 7px;
}

.small {
    width: 28px;
    height: 28px;
    border: 1px solid #ccc;
    background: white;
    border-radius: 5px;
    cursor: pointer;
}

.remove {
    margin-left: auto;
    border: none;
    background: none;
    color: #b00000;
    cursor: pointer;
}

.total {
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    font-size: 17px;
    padding: 14px 0;
}

.clear,
.order {
    width: 100%;
    padding: 9px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
}

.clear {
    background: white;
    border: 1px solid #ccc;
}

.order {
    margin-top: 7px;
    background: #222;
    color: white;
    border: none;
}

.empty {
    text-align: center;
    color: #777;
    padding: 12px;
}
</style>
</head>

<body>

<div class="cart">

    <button class="cart-button" onclick="toggleCart()">
        🛒 Krepšelis (<span id="count">0</span>)
    </button>

    <div class="cart-window" id="cartWindow">

        <div class="title">
            Jūsų krepšelis
        </div>

        <div id="items"></div>

        <div class="total">
            <span>Viso:</span>
            <span id="total">0,00 €</span>
        </div>

        <button class="clear" onclick="clearCart()">
            Ištuštinti krepšelį
        </button>

        <button class="order" onclick="order()">
            Užsakyti
        </button>

    </div>

</div>

<script>

let cart =
    JSON.parse(localStorage.getItem("manoKrepselis")) || [];


function saveCart() {

    localStorage.setItem(
        "manoKrepselis",
        JSON.stringify(cart)
    );

    renderCart();
}


function renderCart() {

    const items =
        document.getElementById("items");

    const count =
        document.getElementById("count");

    const total =
        document.getElementById("total");

    let productCount = 0;
    let sum = 0;

    if (cart.length === 0) {

        items.innerHTML =
            '<div class="empty">Krepšelis tuščias</div>';

    } else {

        items.innerHTML = "";

        cart.forEach((product, index) => {

            productCount += product.quantity;

            sum +=
                product.price * product.quantity;

            const div =
                document.createElement("div");

            div.className = "item";

            div.innerHTML = `
                <div class="item-name">
                    ${product.name}
                </div>

                <div>
                    ${product.price.toFixed(2).replace(".", ",")} €
                </div>

                <div class="controls">

                    <button
                        class="small"
                        onclick="changeQuantity(${index}, -1)">
                        −
                    </button>

                    <span>${product.quantity}</span>

                    <button
                        class="small"
                        onclick="changeQuantity(${index}, 1)">
                        +
                    </button>

                    <button
                        class="remove"
                        onclick="removeProduct(${index})">
                        Pašalinti
                    </button>

                </div>
            `;

            items.appendChild(div);
        });
    }

    count.textContent = productCount;

    total.textContent =
        sum.toFixed(2).replace(".", ",") + " €";
}


function toggleCart() {

    document
        .getElementById("cartWindow")
        .classList.toggle("open");
}


function changeQuantity(index, amount) {

    cart[index].quantity += amount;

    if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
    }

    saveCart();
}


function removeProduct(index) {

    cart.splice(index, 1);

    saveCart();
}


function clearCart() {

    cart = [];

    saveCart();
}


window.addEventListener("storage", function(event) {

    if (event.key === "manoKrepselis") {

        cart =
            JSON.parse(event.newValue) || [];

        renderCart();
    }
});


function order() {

    if (cart.length === 0) {

        alert("Krepšelis tuščias.");

        return;
    }

    let text = "Jūsų užsakymas:\n\n";
    let sum = 0;

    cart.forEach(product => {

        const productTotal =
            product.price * product.quantity;

        sum += productTotal;

        text +=
            product.name +
            " × " +
            product.quantity +
            " — " +
            productTotal.toFixed(2).replace(".", ",") +
            " €\n";
    });

    text +=
        "\nBendra suma: " +
        sum.toFixed(2).replace(".", ",") +
        " €";

    alert(text);
}


renderCart();

</script>

</body>
</html>
