<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    background: transparent;
    font-family: Arial, sans-serif;
}

button {
    background: #222;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
}

button:hover {
    background: #444;
}
</style>
</head>

<body>

<button onclick="openCart()">
    🛒 Krepšelis (<span id="count">0</span>)
</button>

<script>

function updateCount() {

    let cart =
        JSON.parse(localStorage.getItem("manoKrepselis")) || [];

    let count = 0;

    cart.forEach(item => {
        count += item.quantity;
    });

    document.getElementById("count").innerText = count;
}

function openCart() {

    window.open(
        "https://kasmartinu222.github.io/mano-parduotuve/krepselis-pilnas.html",
        "_blank"
    );
}

updateCount();

</script>

</body>
</html>
