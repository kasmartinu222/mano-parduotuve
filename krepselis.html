<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: transparent;
}

.cart-container {
  width: 100%;
  max-width: 700px;
  margin: 20px auto;
}

.cart-title {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 15px;
}

/* LENTELĖ */

.cart-table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  border: 1px solid #ddd;
  border-radius: 10px;
  overflow: hidden;
}

.cart-table th {
  background: #f5f5f5;
  padding: 12px;
  text-align: left;
  border-bottom: 1px solid #ddd;
}

.cart-table td {
  padding: 12px;
  border-bottom: 1px solid #eee;
}

.cart-table tr:last-child td {
  border-bottom: none;
}

/* KIEKIO MYGTUKAI */

.quantity {
  display: flex;
  align-items: center;
  gap: 8px;
}

.quantity button {
  width: 28px;
  height: 28px;
  border: 1px solid #ccc;
  background: white;
  border-radius: 5px;
  cursor: pointer;
  font-size: 16px;
}

.quantity button:hover {
  background: #f0f0f0;
}

.quantity span {
  min-width: 20px;
  text-align: center;
}

/* PAŠALINTI */

.remove {
  color: #c00;
  background: none;
  border: none;
  cursor: pointer;
}

.remove:hover {
  text-decoration: underline;
}

/* APAČIA */

.cart-bottom {
  margin-top: 15px;
  padding: 15px;
  background: white;
  border: 1px solid #ddd;
  border-radius: 10px;
}

.total {
  display: flex;
  justify-content: space-between;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 15px;
}

/* MYGTUKAI */

.buttons {
  display: flex;
  gap: 10px;
}

.clear {
  flex: 1;
  padding: 12px;
  background: white;
  border: 1px solid #ccc;
  border-radius: 7px;
  cursor: pointer;
}

.payment {
  flex: 2;
  padding: 12px;
  background: #222;
  color: white;
  border: none;
  border-radius: 7px;
  cursor: pointer;
  font-size: 16px;
  font-weight: bold;
}

.payment:hover {
  background: #000;
}

.empty {
  padding: 25px;
  text-align: center;
  color: #777;
  background: white;
  border: 1px solid #ddd;
  border-radius: 10px;
}

/* MOBILUS */

@media (max-width: 600px) {

  .cart-container {
    padding: 10px;
    box-sizing: border-box;
  }

  .cart-table th,
  .cart-table td {
    padding: 8px;
    font-size: 14px;
  }

  .buttons {
    flex-direction: column;
  }

  .clear,
  .payment {
    width: 100%;
  }

}

</style>
</head>

<body>

<div class="cart-container">

  <div class="cart-title">
    Jūsų krepšelis
  </div>

  <div id="cartContent"></div>

</div>


<script>

let cart =
  JSON.parse(localStorage.getItem("manoKrepselis")) || [];


/* KREPŠELIO RODYMAS */

function renderCart() {

  const content =
    document.getElementById("cartContent");

  let total = 0;

  if (cart.length === 0) {

    content.innerHTML =
      '<div class="empty">Krepšelis tuščias</div>';

    return;
  }


  let html = `

    <table class="cart-table">

      <thead>
        <tr>
          <th>Produktas</th>
          <th>Kiekis</th>
          <th>Kaina</th>
          <th>Suma</th>
          <th></th>
        </tr>
      </thead>

      <tbody>
  `;


  cart.forEach((product, index) => {

    const productTotal =
      product.price * product.quantity;

    total += productTotal;


    html += `

      <tr>

        <td>
          <strong>${product.name}</strong>
        </td>

        <td>

          <div class="quantity">

            <button
              onclick="changeQuantity(${index}, -1)">
              −
            </button>

            <span>
              ${product.quantity}
            </span>

            <button
              onclick="changeQuantity(${index}, 1)">
              +
            </button>

          </div>

        </td>

        <td>
          ${product.price.toFixed(2).replace(".", ",")} €
        </td>

        <td>
          ${productTotal.toFixed(2).replace(".", ",")} €
        </td>

        <td>

          <button
            class="remove"
            onclick="removeProduct(${index})">
            Pašalinti
          </button>

        </td>

      </tr>

    `;

  });


  html += `

      </tbody>

    </table>


    <div class="cart-bottom">

      <div class="total">

        <span>Viso:</span>

        <span
