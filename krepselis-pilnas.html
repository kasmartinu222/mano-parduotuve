<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mano krepšelis</title>

<style>
body {
    margin: 0;
    padding: 25px;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

.cart {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}

h1 {
    margin-top: 0;
}

.item {
    padding: 15px 0;
    border-bottom: 1px solid #ddd;
}

.name {
    font-weight: bold;
    font-size: 17px;
}

.price {
    margin-top: 5px;
}

.controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
}

.controls button {
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 6px;
    background: #eee;
    cursor: pointer;
    font-size: 18px;
}

.remove {
    margin-left: auto;
    background: #222 !important;
    color: white;
}

.total {
    font-size: 20px;
    font-weight: bold;
    margin-top: 20px;
}

.action {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}

.clear {
    background: #eee;
}

.order {
    background: #222;
    color: white;
}
</style>
</head>

<body>

<div class="cart">

<h1>🛒 Jūsų krepšelis</h1>

<div id="items"></div>

<div class="total">
Suma: <span id="total">0.00</span> €
</div>

<button class="action clear" onclick="clearCart()">
Ištuštinti krepšelį
</button>

<button class="action order" onclick="order()">
Užsakyti
</button>

</div>

<script>

function getCart() {
    return JSON.parse(
        localStorage.getItem("manoKrepselis")
    ) || [];
}

function saveCart(cart) {
    localStorage.setItem(
        "manoKrepselis",
        JSON.stringify(cart)
    );
}

function updateCart() {

    const cart = getCart();

    let total = 0;
    let html = "";

    if (cart.length === 0) {

        html = "<p>Krepšelis tuščias.</p>";

    } else {

        cart.forEach((item, index) => {

            total += item.price * item.quantity;

            html += `
            <div class="item">

                <div class="name">
                    ${item.name}
                </div>

                <div class="price">
                    ${item.price.toFixed(2)} €
                </div>

                <div class="controls">

                    <button onclick="changeQuantity(${index}, -1)">
                        −
                    </button>

                    <span>
                        ${item.quantity}
                    </span>

                    <button onclick="changeQuantity(${index}, 1)">
                        +
                    </button>

                    <button
                        class="remove"
                        onclick="removeItem(${index})">
                        ✕
                    </button>

                </div>

            </div>
            `;
        });
    }

    document.getElementById("items").innerHTML = html;

    document.getElementById("total").innerText =
        total.toFixed(2);
}

function changeQuantity(index, amount) {

    const cart = getCart();

    cart[index].quantity += amount;

    if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
    }

    saveCart(cart);

    updateCart();
}

function removeItem(index) {

    const cart = getCart();

    cart.splice(index, 1);

    saveCart(cart);

    updateCart();
}

function clearCart() {

    localStorage.removeItem("manoKrepselis");

    updateCart();
}

function order() {

    const cart = getCart();

    if (cart.length === 0) {

        alert("Krepšelis tuščias.");

        return;
    }

    let message = "Užsakymas:\n\n";

    let total = 0;

    cart.forEach(item => {

        const itemTotal =
            item.price * item.quantity;

        total += itemTotal;

        message +=
            item.name +
            " × " +
            item.quantity +
            " = " +
            itemTotal.toFixed(2) +
            " €\n";
    });

    message +=
        "\nViso: " +
        total.toFixed(2) +
        " €";

    alert(message);
}

updateCart();

</script>

</body>
</html>
