<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mano parduotuvė</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #222;
    }

    /* PAGRINDINIS KONTEINERIS */
    .shop {
      max-width: 1100px;
      margin: 0 auto;
      position: relative;
    }

    /* ANTRAŠTĖ */
    .shop-title {
      text-align: center;
      margin: 10px 0 35px;
      font-size: 30px;
      font-weight: 700;
    }

    /* PRODUKTŲ TINKLELIS */
    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    /* PRODUKTO KORTELĖ */
    .product {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 300px;
    }

    .product-image {
      width: 100%;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      overflow: hidden;
      border-radius: 10px;
      background: #f8f8f8;
    }

    .product-image img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* VIETA NUOTRAUKAI, JEI DAR NĖRA NUOTRAUKOS */
    .image-placeholder {
      color: #999;
      font-size: 14px;
    }

    .product-name {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.35;
      margin: 5px 0 12px;
    }

    .price {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    /* Į KREPŠELĮ MYGTUKAS */
    .add-button {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 13px 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: #222;
      color: white;
      transition: 0.2s;
    }

    .add-button:hover {
      background: #444;
      transform: translateY(-1px);
    }

    .add-button:active {
      transform: translateY(0);
    }

    /* KREPŠELIO MYGTUKAS */
    .cart-wrapper {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 1000;
    }

    .cart-button {
      border: none;
      background: #222;
      color: white;
      border-radius: 30px;
      padding: 10px 15px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.18);
    }

    .cart-button:hover {
      background: #444;
    }

    /* KREPŠELIO LANGAS */
    .cart {
      display: none;
      position: absolute;
      right: 0;
      top: 50px;
      width: 330px;
      max-width: calc(100vw - 30px);
      background: white;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.18);
    }

    .cart.open {
      display: block;
    }

    .cart-title {
      margin: 0 0 15px;
      font-size: 20px;
      font-weight: 700;
    }

    .empty-cart {
      color: #777;
      text-align: center;
      padding: 15px 0;
    }

    /* KREPŠELIO PREKĖ */
    .cart-item {
      border-bottom: 1px solid #eee;
      padding: 12px 0;
    }

    .cart-item-name {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 7px;
    }

    .cart-item-price {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }

    .cart-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .quantity-button {
      width: 28px;
      height: 28px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 17px;
    }

    .quantity {
      min-width: 20px;
      text-align: center;
      font-weight: 600;
    }

    .remove-button {
      border: none;
      background: none;
      color: #c00;
      cursor: pointer;
      font-size: 13px;
    }

    /* KREPŠELIO APAČIA */
    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 700;
      padding: 16px 0;
    }

    .clear-button {
      width: 100%;
      border: 1px solid #ccc;
      background: white;
      color: #333;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .clear-button:hover {
      background: #f5f5f5;
    }

    .order-button {
      width: 100%;
      border: none;
      background: #222;
      color: white;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .order-button:hover {
      background: #444;
    }

    /* PRANEŠIMAS */
    .message {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%);
      background: #222;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 2000;
    }

    .message.show {
      opacity: 1;
    }

    /* TELEFONAS */
    @media (max-width: 800px) {
      .products {
        grid-template-columns: 1fr;
      }

      .shop-title {
        font-size: 25px;
        margin-top: 45px;
      }

      .product {
        max-width: 500px;
        width: 100%;
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>

  <div class="shop">

    <h1 class="shop-title">Mūsų produktai</h1>

    <!-- KREPŠELIS -->
    <div class="cart-wrapper">

      <button class="cart-button" onclick="toggleCart()">
        🛒 Krepšelis
        (<span id="cartCount">0</span>)
      </button>

      <div class="cart" id="cart">

        <h2 class="cart-title">Jūsų krepšelis</h2>

        <div id="cartItems"></div>

        <div class="cart-total">
          <span>Viso:</span>
          <span id="cartTotal">0,00 €</span>
        </div>

        <button class="clear-button" onclick="clearCart()">
          Ištuštinti krepšelį
        </button>

        <button class="order-button" onclick="placeOrder()">
          Užsakyti
        </button>

      </div>
    </div>


    <!-- PRODUKTAI -->
    <div class="products">

      <!-- 1 PRODUKTAS -->
      <div class="product">

        <div>

          <div class="product-image">
            <!-- ČIA GALĖSI ĮDĖTI PRODUKTO NUOTRAUKĄ -->
            <div class="image-placeholder">
              Produkto nuotrauka
            </div>
          </div>

          <div class="product-name">
            Kondicionierius 380 ml
          </div>

          <div class="price">
            14,99 €
          </div>

        </div>

        <button
          class="add-button"
          onclick="addToCart('Kondicionierius 380 ml', 14.99)">
          Įdėti į krepšelį
        </button>

      </div>


      <!-- 2 PRODUKTAS -->
      <div class="product">

        <div>

          <div class="product-image">
            <!-- ČIA GALĖSI ĮDĖTI PRODUKTO NUOTRAUKĄ -->
            <div class="image-placeholder">
              Produkto nuotrauka
            </div>
          </div>

          <div class="product-name">
            Maitinamasis rankų ir kūno kremas 380 ml
          </div>

          <div class="price">
            17,99 €
          </div>

        </div>

        <button
          class="add-button"
          onclick="addToCart('Maitinamasis rankų ir kūno kremas 380 ml', 17.99)">
          Įdėti į krepšelį
        </button>

      </div>


      <!-- 3 PRODUKTAS -->
      <div class="product">

        <div>

          <div class="product-image">
            <!-- ČIA GALĖSI ĮDĖTI PRODUKTO NUOTRAUKĄ -->
            <div class="image-placeholder">
              Produkto nuotrauka
            </div>
          </div>

          <div class="product-name">
            Šampūnas 380 ml
          </div>

          <div class="price">
            21,99 €
          </div>

        </div>

        <button
          class="add-button"
          onclick="addToCart('Šampūnas 380 ml', 21.99)">
          Įdėti į krepšelį
        </button>

      </div>

    </div>

  </div>


  <!-- PRANEŠIMAS -->
  <div class="message" id="message">
    Prekė įdėta į krepšelį
  </div>


  <script>

    /* =========================
       KREPŠELIO DUOMENYS
       ========================= */

    let cart = JSON.parse(localStorage.getItem("manoKrepselis")) || [];


    /* =========================
       ĮDĖTI PREKĘ
       ========================= */

    function addToCart(name, price) {

      const existingProduct = cart.find(
        product => product.name === name
      );

      if (existingProduct) {

        existingProduct.quantity += 1;

      } else {

        cart.push({
          name: name,
          price: price,
          quantity: 1
        });

      }

      saveCart();
      renderCart();
      showMessage("Prekė įdėta į krepšelį");

    }


    /* =========================
       IŠSAUGOTI KREPŠELĮ
       ========================= */

    function saveCart() {

      localStorage.setItem(
        "manoKrepselis",
        JSON.stringify(cart)
      );

    }


    /* =========================
       RODYTI KREPŠELĮ
       ========================= */

    function renderCart() {

      const cartItems =
        document.getElementById("cartItems");

      const cartCount =
        document.getElementById("cartCount");

      const cartTotal =
        document.getElementById("cartTotal");


      let totalItems = 0;
      let totalPrice = 0;


      if (cart.length === 0) {

        cartItems.innerHTML =
          '<div class="empty-cart">Krepšelis tuščias</div>';

      } else {

        cartItems.innerHTML = "";


        cart.forEach((product, index) => {

          totalItems += product.quantity;

          totalPrice +=
            product.price * product.quantity;


          const item = document.createElement("div");

          item.className = "cart-item";


          item.innerHTML = `

            <div class="cart-item-name">
              ${product.name}
            </div>

            <div class="cart-item-price">
              ${formatPrice(product.price)}
              × ${product.quantity}
            </div>

            <div class="cart-controls">

              <div class="quantity-controls">

                <button
                  class="quantity-button"
                  onclick="changeQuantity(${index}, -1)">
                  −
                </button>

                <span class="quantity">
                  ${product.quantity}
                </span>

                <button
                  class="quantity-button"
                  onclick="changeQuantity(${index}, 1)">
                  +
                </button>

              </div>

              <button
                class="remove-button"
                onclick="removeProduct(${index})">
                Pašalinti
              </button>

            </div>
          `;


          cartItems.appendChild(item);

        });

      }


      cartCount.textContent = totalItems;

      cartTotal.textContent =
        formatPrice(totalPrice);

    }


    /* =========================
       KEISTI KIEKĮ
       ========================= */

    function changeQuantity(index, amount) {

      cart[index].quantity += amount;


      if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

      }


      saveCart();
      renderCart();

    }


    /* =========================
       PAŠALINTI PREKĘ
       ========================= */

    function removeProduct(index) {

      cart.splice(index, 1);

      saveCart();
      renderCart();

    }


    /* =========================
       IŠTUŠTINTI KREPŠELĮ
       ========================= */

    function clearCart() {

      if (cart.length === 0) {
        return;
      }


      cart = [];

      saveCart();
      renderCart();

    }


    /* =========================
       ATIDARYTI / UŽDARYTI
       ========================= */

    function toggleCart() {

      const cartElement =
        document.getElementById("cart");

      cartElement.classList.toggle("open");

    }


    /* =========================
       KAINOS FORMATAVIMAS
       ========================= */

    function formatPrice(price) {

      return price
        .toFixed(2)
        .replace(".", ",") + " €";

    }


    /* =========================
       PRANEŠIMAS
       ========================= */

    function showMessage(text) {

      const message =
        document.getElementById("message");

      message.textContent = text;

      message.classList.add("show");


      setTimeout(() => {

        message.classList.remove("show");

      }, 1800);

    }


    /* =========================
       UŽSAKYMAS
       ========================= */

    function placeOrder() {

      if (cart.length === 0) {

        showMessage("Krepšelis tuščias");

        return;

      }


      let orderText = "Užsakymas:%0A%0A";

      let total = 0;


      cart.forEach(product => {

        const productTotal =
          product.price * product.quantity;

        total += productTotal;


        orderText +=
          product.name +
          " × " +
          product.quantity +
          " — " +
          formatPrice(productTotal) +
          "%0A";

      });


      orderText +=
        "%0AViso: " +
        formatPrice(total);


      /*
        ČIA KOL KAS TIK PARODOMAS UŽSAKYMO TEKSTAS.
        Vėliau galime prijungti:
        - el. paštą
        - Google Forms
        - Google Sheets
        - užsakymo formą
        - mokėjimus
      */

      alert(
        "Užsakymas paruoštas!\n\n" +
        decodeURIComponent(orderText.replace(/%0A/g, "\n"))
      );

    }


    /* =========================
       PALEIDIMAS
       ========================= */

    renderCart();

  </script>

</body>
</html>
