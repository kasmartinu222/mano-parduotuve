<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

.top {
    text-align: right;
    margin-bottom: 20px;
}

.cart-btn {
    background: #222;
    color: white;
    border: 0;
    border-radius: 20px;
    padding: 10px 16px;
    cursor: pointer;
}

.products {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.product {
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 18px;
    width: 220px;
    text-align: center;
}

.product h3 {
    font-size: 17px;
}

.price {
    font-size: 18px;
    margin: 12px;
}

.add {
    background: #222;
    color: white;
    border: 0;
    border-radius: 7px;
    padding: 10px 15px;
    cursor: pointer;
}

.cart {
    display: none;
    position: fixed;
    top: 70px;
    right: 20px;
    width: 320px;
    max-height: 80vh;
    overflow-y: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 25px rgba(0,0,0,.25);
    z-index: 9999;
}

.cart.show {
    display: block;
}

.item {
    padding: 12px 0;
    border-bottom: 1px solid #ddd;
}

.controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
}

.controls button {
    border: 0;
    border-radius: 5px;
    padding: 6px 10px;
    cursor: pointer;
}

.remove {
    margin-left: auto;
    background: #222;
    color: white;
}

.total {
    font-size: 18px;
    font-weight: bold;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="top">
<button class="cart-btn" onclick="toggleCart()">
🛒 Krepšelis (<span id="count">0</span>)
</button>
</div>

<div class="products">

<div class="product">
<h3>Kondicionierius 380 ml</h3>
<div class="price">14,99 €</div>
<button class="add" onclick="add('Kondicionierius 380 ml',14.99)">
Įdėti į krepšelį
</button>
</div>

<div class="product">
<h3>Maitinamasis rankų ir kūno kremas 380 ml</h3>
<div class="price">17,99 €</div>
<button class="add" onclick="add('Maitinamasis rankų ir kūno kremas 380 ml',17.99)">
Įdėti į krepšelį
</button>
</div>

<div class="product">
<h3>Šampūnas 380 ml</h3>
<div class="price">21,99 €</div>
<button class="add" onclick="add('Šampūnas 380 ml',21.99)">
Įdėti į krepšelį
</button>
</div>

</div>

<div class="cart" id="cart">

<h2>🛒 Krepšelis</h2>

<div id="items"></div>

<div class="total">
Suma: <span id="total">0.00</span> €
</div>

</div>

<script>

let cart = [];

function add(name, price) {

let item = cart.find(x => x.name === name);

if (item) {
item.quantity++;
} else {
cart.push({
name: name,
price: price,
quantity: 1
});
}

update();
}

function update() {

let count = 0;
let total = 0;
let html = "";

cart.forEach((item, i) => {

count += item.quantity;
total += item.price * item.quantity;

html += `
<div class="item">

<strong>${item.name}</strong><br>
${item.price.toFixed(2)} €

<div class="controls">

<button onclick="change(${i},-1)">−</button>

<span>${item.quantity}</span>

<button onclick="change(${i},1)">+</button>

<button class="remove" onclick="remove(${i})">✕</button>

</div>

</div>
`;

});

if (cart.length === 0) {
html = "<p>Krepšelis tuščias.</p>";
}

document.getElementById("items").innerHTML = html;
document.getElementById("count").innerText = count;
document.getElementById("total").innerText = total.toFixed(2);
}

function change(i, amount) {

cart[i].quantity += amount;

if (cart[i].quantity <= 0) {
cart.splice(i,1);
}

update();
}

function remove(i) {

cart.splice(i,1);

update();
}

function toggleCart() {

document.getElementById("cart")
.classList.toggle("show");

update();
}

update();

</script>

</body>
</html>
